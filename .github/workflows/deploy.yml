# Builds the site with Vite and uploads it to Namecheap over FTP
# every time you push to the main branch.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Never run two deploys at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Collect only the files the live site needs into dist/
      # (keeps src/, node_modules/, configs, etc. off the server)
      - name: Assemble site
        run: |
          mkdir -p dist/css dist/js
          cp index.php JoeVernazzaResume.pdf dist/
          cp css/main.css dist/css/
          cp -r js/. dist/js/
          cp -r images dist/

      - name: Upload to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
