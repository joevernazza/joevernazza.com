# Builds the site with Vite and uploads it to Namecheap over SSH (rsync)
# every time you push to the main branch.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Never run two deploys at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Collect only the files the live site needs into dist/
      # (keeps src/, node_modules/, configs, etc. off the server)
      - name: Assemble site
        run: |
          mkdir -p dist/css dist/js
          cp index.php JoeVernazzaResume.pdf dist/
          cp css/main.css dist/css/
          cp -r js/. dist/js/
          cp -r images dist/

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # Copies dist/ to the server, only sending files that changed.
      # (No --delete, so other files on the server, e.g. .htaccess, are left alone.)
      - name: Upload to Namecheap
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"
